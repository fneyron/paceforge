name: Publish iPhone to TestFlight

on:
  workflow_dispatch:
  # or a tag on a commit of main (git tag testflight-YYYY-MM-DD <sha> && git push origin testflight-YYYY-MM-DD),
  # or a push to main whose head commit message holds [testflight]
  push:
    branches: [main]
    tags: ['testflight-*']

permissions:
  contents: read

concurrency:
  group: paceforge-ios-testflight
  cancel-in-progress: false

jobs:
  check:
    # a push to main releases only when its head commit asks for it
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[testflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release branch and Expo access configuration
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/testflight-*)
              # a release tag must name a commit of main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo '::error::This release tag does not point at a commit of main.'
                exit 1
              fi ;;
            *)
              echo '::error::Run this release workflow from main, or tag a commit of main with testflight-*.'
              exit 1 ;;
          esac
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo '::error::EXPO_TOKEN is missing from GitHub Actions secrets. Configure the existing Expo account token before publishing. No macOS build has started.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@24.12.1 whoami > /dev/null
      - name: Read the app version from app.json
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PaceForge $version (the build number is assigned by EAS)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npx expo prebuild --no-install
      - name: Check generated iOS HealthKit purpose strings
        run: python3 scripts/check-ios-health-privacy.py ios/PaceForge/Info.plist
      - name: Check generated background health sync configuration
        run: >-
          python3 scripts/check-background-sync.py
          --entitlements ios/PaceForge/PaceForge.entitlements
          --info-plist ios/PaceForge/Info.plist
      - name: Check generated iOS release metadata and privacy manifest
        run: python3 ../scripts/verify-ios-release.py --prebuilt ios/PaceForge app.json
      - run: npx expo export --platform ios --platform android
      - name: Check the bundle size budget
        run: python3 scripts/check-bundle-size.py dist

  publish:
    needs: check
    # The current macOS image; the newest release Xcode on it is selected below.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # The Xcode major this project builds with (Apple requires the iOS 26 SDK for App
      # Store uploads); a newer major is never picked silently.
      XCODE_MIN: '26'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      PF_APP_VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select the newest release Xcode of the required major on this runner
        run: |
          xcode=$(ls -d /Applications/Xcode_"$XCODE_MIN".app /Applications/Xcode_"$XCODE_MIN".*.app 2>/dev/null | grep -Eiv 'beta|candidate' | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::No release Xcode $XCODE_MIN.x on this runner image. Raise XCODE_MIN once the project builds with a newer Xcode."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Check local iOS build tools
        # Both ship with the GitHub macOS images: a missing one is an image change to look at, not something to install here.
        run: |
          for tool in pod fastlane; do
            if ! command -v "$tool" > /dev/null; then echo "::error::$tool is missing from this runner image."; exit 1; fi
          done
          pod --version
          fastlane --version
      - run: npm ci
      - name: Build signed iPhone archive on this runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@24.12.1 build --platform ios --profile production \
            --local --non-interactive --freeze-credentials \
            --output "$RUNNER_TEMP/PaceForge.ipa"
      - name: Verify the exact archive before submission
        run: python3 ../scripts/verify-ios-release.py "$RUNNER_TEMP/PaceForge.ipa" app.json
      - name: Submit this archive to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@24.12.1 submit --platform ios --profile production \
            --path "$RUNNER_TEMP/PaceForge.ipa" --non-interactive --wait
          echo "PaceForge $PF_APP_VERSION submitted to TestFlight." >> "$GITHUB_STEP_SUMMARY"
      # The repository is public: neither the IPA nor signing files become
      # downloadable GitHub artifacts. EAS cleans its temporary signing keychain.
      - name: Remove the local archive
        if: always()
        run: rm -f "$RUNNER_TEMP/PaceForge.ipa"
