name: Publish iPhone to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paceforge-ios-testflight
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check release branch and Expo access configuration
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Run this release workflow from main only.'
            exit 1
          fi
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo '::error::EXPO_TOKEN is missing from GitHub Actions secrets. Configure the existing Expo account token before publishing. No macOS build has started.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@24.12.1 whoami > /dev/null
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npx expo prebuild --no-install
      - name: Check generated iOS HealthKit purpose strings
        run: python3 scripts/check-ios-health-privacy.py ios/PaceForge/Info.plist
      - run: npx expo export --platform ios --platform android

  publish:
    needs: check
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check local iOS build tools
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo '::error::This release requires Xcode 26.6. The selected runner image no longer provides it.'
            exit 1
          fi
          xcodebuild -version
          if ! command -v pod > /dev/null; then brew install cocoapods; fi
          if ! command -v fastlane > /dev/null; then brew install fastlane; fi
          pod --version
          fastlane --version
      - run: npm ci
      - name: Build signed iPhone archive on this runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@24.12.1 build --platform ios --profile production \
            --local --non-interactive --freeze-credentials \
            --output "$RUNNER_TEMP/PaceForge.ipa"
      - name: Verify the exact archive before submission
        run: python3 ../scripts/verify-ios-release.py "$RUNNER_TEMP/PaceForge.ipa" app.json
      - name: Submit this archive to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@24.12.1 submit --platform ios --profile production \
            --path "$RUNNER_TEMP/PaceForge.ipa" --non-interactive --wait
      # The repository is public: neither the IPA nor signing files become
      # downloadable GitHub artifacts. EAS cleans its temporary signing keychain.
      - name: Remove the local archive
        if: always()
        run: rm -f "$RUNNER_TEMP/PaceForge.ipa"
