name: Quality gate

# ruff with pyproject's rules, mypy held to « no new finding » against mypy-baseline.txt (docs/quality.md).
# Deploys do not wait for it yet (deploy.yml): make them once main is clean.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: ruff
        run: ruff check --output-format github .

      - name: mypy, no new finding
        if: success() || failure()
        run: python scripts/mypy_baseline.py check
