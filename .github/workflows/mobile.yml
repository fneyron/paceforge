name: Mobile companion checks
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native previews to build
        type: choice
        options: [all, android, ios]
        default: all
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run lint && npm run typecheck && npm test
        working-directory: mobile
      - run: npx expo prebuild --no-install
        working-directory: mobile
      - run: npx expo export --platform ios --platform android
        working-directory: mobile

  android-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'ios'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Build installable Android preview
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: paceforge-android-preview
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  ios-simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'android'
    needs: check
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Prepare iPhone Simulator while native code builds
        timeout-minutes: 4
        run: |
          runtime_id=$(xcrun simctl list runtimes --json | python3 -c '
          import json, subprocess, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          sdk = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip()
          print(next(r["identifier"] for r in runtimes if r["isAvailable"]
                     and ".iOS-" in r["identifier"] and r["version"].split(".")[:2] == sdk.split(".")[:2]))')
          simulator_id=$(xcrun simctl create PaceForgeCI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime_id")
          echo "PF_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          open -a Simulator --args -CurrentDeviceUDID "$simulator_id"
      - name: Install native iOS dependencies
        run: pod install --project-directory=ios
      - name: Compile native iOS release for Apple Silicon Simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/PaceForge.xcworkspace -scheme PaceForge \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios -resultBundlePath build/ios-result \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            build > ios-build.log 2>&1 || { tail -n 100 ios-build.log; exit 1; }
          test -s build/ios/Build/Products/Release-iphonesimulator/PaceForge.app/main.jsbundle
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/Build/Products/Release-iphonesimulator/PaceForge.app \
            PaceForge-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: paceforge-ios-simulator
          path: mobile/PaceForge-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Launch app in iPhone Simulator
        timeout-minutes: 12
        run: |
          exec > >(tee ios-smoke.log) 2>&1
          simulator_id="$PF_SIMULATOR_ID"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" build/ios/Build/Products/Release-iphonesimulator/PaceForge.app
          xcrun simctl launch "$simulator_id" Fr.paceforge.mobile -AppleLanguages '(fr)' -AppleLocale fr_FR
          sleep 15
          xcrun simctl spawn "$simulator_id" launchctl list | python3 -c '
          import sys
          rows = [line.split() for line in sys.stdin if "Fr.paceforge.mobile" in line]
          assert any(row[0].isdigit() and int(row[0]) > 0 for row in rows), "PaceForge exited after launch"'
          xcrun simctl io "$simulator_id" screenshot ios-simulator.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paceforge-ios-build-diagnostics
          path: |
            mobile/ios-build.log
            mobile/ios-smoke.log
            mobile/build/ios-result.xcresult
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: paceforge-ios-simulator-screenshot
          path: mobile/ios-simulator.png
          if-no-files-found: error
          retention-days: 14
