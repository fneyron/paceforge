{% extends "base.html" %}

{% block title %}{{ saved_route_name }} — PaceForge{% endblock title %}

{% block head %}
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3"></script>
<style>
.maplibregl-popup-content { font-family: Inter, system-ui, sans-serif; border-radius: 10px; padding: 12px; }
.map-container { position: relative; z-index: 0; overflow: hidden; }
/* Hide native number spinners so narrow time inputs don't truncate their value. */
.sim-num::-webkit-outer-spin-button, .sim-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sim-num { -moz-appearance: textfield; appearance: textfield; }
</style>
{% endblock %}

{% block content %}
<div class="space-y-4">
    <a href="/simulator" class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
        Tous les parcours
    </a>
    {% include "partials/gpx_result.html" %}

    <!-- Simulated vs actual: compare a real Strava result to the prediction -->
    <div hx-get="/api/simulator/routes/{{ saved_route_id }}/result?v=1" hx-trigger="load" hx-swap="innerHTML"></div>

    <!-- Nutrition plan: loaded after the page so the heavy map/chart render first -->
    <div id="nutrition-wrap" hx-get="/partials/simulator/nutrition/{{ saved_route_id }}?v=10" hx-trigger="load" hx-swap="innerHTML">
        <div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
            <div class="flex items-center gap-2 text-sm text-gray-400">
                <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                Plan nutritionnel…
            </div>
        </div>
    </div>
</div>
{% endblock content %}
