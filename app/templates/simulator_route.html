{% extends "base.html" %}

{% block title %}{{ saved_route_name }} — PaceForge{% endblock title %}

{% block head %}
<script src="https://unpkg.com/idiomorph@0.3.0/dist/idiomorph.min.js"></script>
<style>
.maplibregl-popup-content { font-family: var(--sans); border-radius: 6px; padding: 12px; font-size: 13px; line-height: 1.35; color: #1C1A16; background: #FBF8F1; border: 1.5px solid #1C1A16; }
/* phone: the map opens full screen (a pitched 3D map cannot live in a 200 px strip) */
#map-wrap.map-full { position: fixed; inset: 0; z-index: 60; background: var(--paper); height: 100dvh; }
#map-wrap.map-full #courseMap { height: 100%; }
@media (pointer: coarse) { #simulator-root input, #simulator-root select { font-size: 16px; } }
#map-wrap .map-close { display: none; }
#map-wrap.map-full .map-close { display: inline-flex; }
#map-wrap.map-full .map-expand { display: none; }
.map-ctl { background: #FBF8F1; border-radius: 4px; border: 1.5px solid #1C1A16; font: 600 12px/1 var(--mono); color: #1C1A16; padding: 0 9px; height: 29px; display: inline-flex; align-items: center; cursor: pointer; }
.map-ctl[aria-pressed="true"] { background: #1C1A16; color: #FBF8F1; }
.cp-marker { width: 16px; height: 16px; background: #1C1A16; border: 2px solid #FBF8F1; box-shadow: 0 1px 3px rgba(0,0,0,.35); cursor: pointer; }
.cp-marker.water { background: #FBF8F1; border: 3px solid #2A6799; border-radius: 50%; }
.cp-marker.base::after { content: ''; display: block; width: 6px; height: 6px; margin: 3px; background: #D9411B; }
.cp-marker.none { background: #FBF8F1; border: 2px dashed #1C1A16; border-radius: 50%; }
.cp-marker.late { outline: 3px solid #D9411B; }
.map-container { position: relative; z-index: 0; overflow: hidden; }
/* Hide native number spinners so narrow time inputs don't truncate their value. */
.sim-num::-webkit-outer-spin-button, .sim-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sim-num { -moz-appearance: textfield; appearance: textfield; }
summary::-webkit-details-marker { display: none; }
/* Inline time fields: no picker icon, the value alone. */
.time-inline::-webkit-calendar-picker-indicator { display: none; -webkit-appearance: none; }
.time-inline { -webkit-appearance: none; appearance: none; }
input[type=date].time-inline::-webkit-calendar-picker-indicator { display: none; }
.fit { field-sizing: content; }
</style>
{% endblock %}

{% block content %}
<div class="space-y-4">
    <a href="/simulator" class="rb-back">‹ Courses</a>

    {% include "partials/gpx_result.html" %}

    <div id="rpanel-bags" role="tabpanel" aria-labelledby="rtab-bags" class="rb-panel hidden">
        <div id="bags-wrap" hx-get="/partials/simulator/roadbook/{{ saved_route_id }}/bags" hx-trigger="intersect once" hx-swap="innerHTML">
            <p class="text-sm rb-muted py-6">Préparation des sacs…</p>
        </div>
    </div>

    <div id="rpanel-realise" role="tabpanel" aria-labelledby="rtab-realise" class="rb-panel hidden space-y-4">
        <div hx-get="/api/simulator/routes/{{ saved_route_id }}/result?v=4{% if compare_activity_id %}&preselect={{ compare_activity_id }}{% endif %}" hx-trigger="intersect once" hx-swap="innerHTML"></div>
    </div>
</div>
{% endblock content %}

{% block scripts %}
<script>
function switchRouteTab(tab) {
    ['plan', 'bags', 'realise'].forEach(function(t) {
        var panel = document.getElementById('rpanel-' + t), btn = document.getElementById('rtab-' + t);
        if (!panel || !btn) return;
        panel.classList.toggle('hidden', t !== tab);
        btn.setAttribute('aria-selected', t === tab ? 'true' : 'false');
    });
    // a tab reloads only when the plan changed since it was last loaded (planVersion from the plan page)
    var pv = (window._sim && window._sim.planVersionOf) ? window._sim.planVersionOf() : 0;
    var urls = { bags: ['/partials/simulator/roadbook/{{ saved_route_id }}/bags', '#bags-wrap'], realise: ['/api/simulator/routes/{{ saved_route_id }}/result?v=4', '#rpanel-realise > div'] };
    if (urls[tab] && window.htmx && tabLoadedAt[tab] !== undefined && tabLoadedAt[tab] !== pv) {
        window.htmx.ajax('GET', urls[tab][0], { target: urls[tab][1], swap: 'innerHTML' });
        tabLoadedAt[tab] = pv;
    }
    try { history.replaceState(null, '', tab === 'plan' ? location.pathname : '#' + tab); } catch (e) {}
}
var tabLoadedAt = {};
document.body.addEventListener('htmx:afterSwap', function (ev) {
    var id = ev.target && ev.target.id, pv = (window._sim && window._sim.planVersionOf) ? window._sim.planVersionOf() : 0;
    if (id === 'bags-wrap') tabLoadedAt.bags = pv; else if (ev.target && ev.target.parentElement && ev.target.parentElement.id === 'rpanel-realise') tabLoadedAt.realise = pv;
});
// Détails changed the nutrition or the heart-rate ceilings: the consigne lines and the bags follow
document.body.addEventListener('pf-plan-changed', function () { if (window._sim && window._sim.recalc) window._sim.recalc(); });
document.addEventListener('DOMContentLoaded', function () {
    var h = (location.hash || '').slice(1);
    if (['bags', 'realise'].indexOf(h) >= 0) switchRouteTab(h);
});
{% if compare_activity_id %}
// Arrived from an activity ("Comparer à un parcours"): open the debrief tab.
document.addEventListener('DOMContentLoaded', function () { switchRouteTab('realise'); });
{% endif %}
</script>
{% endblock scripts %}
