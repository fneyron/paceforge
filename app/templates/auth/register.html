{% extends "base.html" %}
{% block title %}Inscription — PaceForge{% endblock %}
{% block content_public %}
<div class="pf-auth">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <a href="/" class="pf-logo pf-auth-logo" aria-label="PaceForge, accueil">{% include "partials/_logo_mark.html" %}<span>PaceForge</span></a>
            <h1 class="pf-h1 pf-auth-h1">Crée ton compte</h1>
        </div>

        {% if error %}
        <div class="mb-4 pf-note !text-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/register" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="firstname" class="pf-field-label">Prénom</label>
                    <input type="text" name="firstname" id="firstname" value="{{ firstname or '' }}"
                           class="pf-input">
                </div>
                <div>
                    <label for="lastname" class="pf-field-label">Nom</label>
                    <input type="text" name="lastname" id="lastname" value="{{ lastname or '' }}"
                           class="pf-input">
                </div>
            </div>
            <div>
                <label for="email" class="pf-field-label">Email</label>
                <input type="email" name="email" id="email" required value="{{ email or '' }}"
                       class="pf-input">
            </div>
            <div>
                <label for="password" class="pf-field-label">Mot de passe</label>
                <input type="password" name="password" id="password" required minlength="8"
                       placeholder="8 caractères minimum"
                       class="pf-input">
            </div>
            <button type="submit"
                    class="pf-btn pf-btn-primary pf-btn-block">
                Créer mon compte
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-500">
            Déjà un compte ? <a href="/auth/login" class="pf-link">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
