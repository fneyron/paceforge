{% extends "base.html" %}
{% block title %}Nouveau mot de passe — PaceForge{% endblock %}
{% block content_public %}
<div class="pf-auth">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <a href="/" class="pf-logo pf-auth-logo" aria-label="PaceForge, accueil">{% include "partials/_logo_mark.html" %}<span>PaceForge</span></a>
            <h1 class="pf-h1 pf-auth-h1">Nouveau mot de passe</h1>
        </div>

        {% if error %}
        <div class="mb-4 pf-note !text-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/reset-password" class="space-y-4">
            <input type="hidden" name="token" value="{{ token }}">
            <div>
                <label for="password" class="pf-field-label">Nouveau mot de passe</label>
                <input type="password" name="password" id="password" required minlength="8"
                       placeholder="8 caractères minimum"
                       class="pf-input">
            </div>
            <button type="submit"
                    class="pf-btn pf-btn-primary pf-btn-block">
                Enregistrer
            </button>
        </form>
    </div>
</div>
{% endblock %}
