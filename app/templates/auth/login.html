{% extends "base.html" %}
{% block title %}Connexion — PaceForge{% endblock %}
{% block content_public %}
<div class="pf-auth">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <a href="/" class="pf-logo pf-auth-logo" aria-label="PaceForge, accueil">{% include "partials/_logo_mark.html" %}<span>PaceForge</span></a>
            <h1 class="pf-h1 pf-auth-h1">Connexion</h1>
        </div>

        {% if error %}
        <div class="mb-4 pf-note !text-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/login" class="space-y-4">
            <div>
                <label for="email" class="pf-field-label">Email</label>
                <input type="email" name="email" id="email" required value="{{ email or '' }}" autofocus autocomplete="email"
                       class="pf-input">
            </div>
            <div>
                <label for="password" class="pf-field-label">Mot de passe</label>
                <input type="password" name="password" id="password" required autocomplete="current-password"
                       class="pf-input">
            </div>
            <button type="submit"
                    class="pf-btn pf-btn-primary pf-btn-block">
                Se connecter
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/auth/forgot-password" class="text-sm text-gray-400 hover:text-gray-600">Mot de passe oublié ?</a>
        </div>

        <p class="mt-6 text-center text-sm text-gray-500">
            Pas encore de compte ? <a href="/auth/register" class="pf-link">S'inscrire</a>
        </p>
    </div>
</div>
{% endblock %}
