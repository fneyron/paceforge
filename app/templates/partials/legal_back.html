{#- The legal pages' « ← Retour »: back in the history when the page was opened from this site (Réglages, another
    page's footer), else the home page. window.* by name: inside an inline handler, URL is document.URL. -#}
<a href="/" class="pf-back" onclick="try { var w = window; if (document.referrer && new w.URL(document.referrer).origin === w.location.origin && w.history.length > 1) { event.preventDefault(); w.history.back(); } } catch (e) {}">&larr; Retour</a>
