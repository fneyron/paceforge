{#- « Semaines précédentes »: one request at a time (hx-sync), never disabled (a disabled button drops the focus to the
    page): aria-disabled while it loads; then the focus goes to the first week added and the page's polite region says
    how many came (app.js) -#}
{% if has_more %}
<div class="text-center pt-6">
    <button type="button" data-load-more hx-get="/partials/activities?page={{ page + 1 }}{% if sport %}&sport={{ sport }}{% endif %}"
            hx-target="#activity-list"
            hx-swap="beforeend"
            hx-sync="this:drop"
            hx-indicator="#load-spinner"
            class="pf-btn pf-btn-secondary pf-btn-sm">
        Semaines précédentes
        <span id="load-spinner" class="htmx-indicator ml-1.5">
            <svg width="14" height="14" class="animate-spin h-3.5 w-3.5 inline" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
            </svg>
        </span>
    </button>
</div>
{% endif %}
